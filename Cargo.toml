[workspace]
members = ["crates/compiler", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-m3.6b"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
clvmr = "=0.19.0"
chia-bls = "=0.38.2"
num-bigint = "=0.4.6"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
