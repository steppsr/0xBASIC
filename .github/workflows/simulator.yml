name: Isolated simulator checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulator:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bin: Scripts
            python: python.exe
            executable: 0xbasic.exe
          # Python 3.13.7 is available on 24.04; ubuntu-latest may select 26.04.
          - os: ubuntu-24.04
            platform: linux
            bin: bin
            python: python
            executable: 0xbasic
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.work/m4/uv-cache
      PIP_CACHE_DIR: ${{ github.workspace }}/.work/m4/pip-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
          architecture: x64
      - name: Build pinned compiler
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo build --workspace --locked
      - name: Install isolated hash-locked simulator
        run: |
          python -m venv .work/m4/tools
          .work/m4/tools/${{ matrix.bin }}/${{ matrix.python }} -m pip --isolated install --cache-dir .work/m4/pip-cache --require-hashes -r simulator/tools.lock
          .work/m4/tools/${{ matrix.bin }}/uv venv --python 3.13.7 --no-python-downloads .work/m4/venv
          .work/m4/tools/${{ matrix.bin }}/uv pip install --python .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} --require-hashes -r simulator/requirements-${{ matrix.platform }}.lock --build-constraints simulator/build-requirements.lock
          .work/m4/tools/${{ matrix.bin }}/uv pip check --python .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }}
      - name: Verify fee constructor with independent VM
        # The compiler constructor gate uses the pinned independent Chia VM.
        run: .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} tools/verify_reserve_fee.py --with-upstream --binary target/debug/${{ matrix.executable }}
      - name: Verify offline testnet fee preparation
        run: .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} integration/verify_preparation.py --binary target/debug/${{ matrix.executable }}
      - name: Verify offline detached fee signatures
        run: .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} integration/verify_signing.py --binary target/debug/${{ matrix.executable }}
      - name: Verify test-owner key creation with public fixtures
        run: .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} integration/verify_owner_keys.py
      - name: Verify approved offline fee signing with public fixtures
        run: .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} integration/verify_signer.py --binary target/debug/${{ matrix.executable }}
      - name: Verify operator confirmation through local mutual TLS
        run: .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} integration/verify_operator_confirmation.py --binary target/debug/${{ matrix.executable }}
      - name: Test simulator reporting failure paths
        run: .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} -m unittest discover -s simulator -p 'test_*.py'
      - name: Verify all scenarios and identical fresh reruns
        run: .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} simulator/verify.py --binary target/debug/${{ matrix.executable }}
      - name: Verify loop payments and identical fresh reruns
        run: .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} simulator/loop_payment.py --binary target/debug/${{ matrix.executable }}
      - name: Verify payment and change scenarios
        run: .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} simulator/payment_change.py --binary target/debug/${{ matrix.executable }}
      - name: Verify signed fee payments and aggregate reservations
        run: .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} simulator/fee_payment.py --binary target/debug/${{ matrix.executable }}
      - name: Verify full-node compiled payment
        run: .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} simulator/full_node_smoke.py --payment --binary target/debug/${{ matrix.executable }}
      - name: Verify isolated full-node fee RPC
        run: .work/m4/venv/${{ matrix.bin }}/${{ matrix.python }} simulator/full_node_smoke.py --rpc --binary target/debug/${{ matrix.executable }}
      - name: Upload full-node RPC evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-node-rpc-${{ matrix.platform }}
          path: .work/m5/full-node-rpc-${{ matrix.platform }}.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload full-node payment evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-node-evidence-${{ matrix.platform }}
          path: .work/m5/full-node-payment-${{ matrix.platform }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload complete verified evidence
        uses: actions/upload-artifact@v4
        with:
          name: spendsim-evidence-${{ matrix.platform }}
          path: |
            .work/m4/verification-${{ matrix.platform }}.json
            .work/m4/loop-payment-${{ matrix.platform }}.json
            .work/m4/payment-change-${{ matrix.platform }}.json
            .work/m4/fee-payment-${{ matrix.platform }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload offline testnet preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: testnet-preparation-${{ matrix.platform }}
          path: .work/testnet/preparation-${{ matrix.platform }}.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload offline testnet signing evidence
        uses: actions/upload-artifact@v4
        with:
          name: testnet-signing-${{ matrix.platform }}
          path: .work/testnet/signing-${{ matrix.platform }}.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload test-owner key validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: testnet-owner-keys-${{ matrix.platform }}
          path: .work/testnet/owner-keys-${{ matrix.platform }}.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload approved signer evidence
        uses: actions/upload-artifact@v4
        with:
          name: testnet-signer-${{ matrix.platform }}
          path: .work/testnet/signer-${{ matrix.platform }}.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload operator confirmation evidence
        uses: actions/upload-artifact@v4
        with:
          name: testnet-operator-confirmation-${{ matrix.platform }}
          path: .work/testnet/operator-confirmation-${{ matrix.platform }}.json
          include-hidden-files: true
          if-no-files-found: error
